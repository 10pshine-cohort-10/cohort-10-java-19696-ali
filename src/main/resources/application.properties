spring.application.name=contact-book
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=contact_book;encrypt=true;trustServerCertificate=false}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-sqlserver.sql
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=32
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.address=${BIND_ADDRESS:127.0.0.1}
server.error.include-message=never
