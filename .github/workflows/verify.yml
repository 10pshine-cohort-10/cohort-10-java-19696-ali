name: Verify contact book
on:
  push:
    branches: [contact-management]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build React
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Run tests and generate coverage
        run: mvn -B clean verify
      - name: Exercise the SQL Server schema and API
        shell: bash
        run: |
          set -euo pipefail
          db_password="Aq1!$(openssl rand -hex 20)"
          echo "::add-mask::$db_password"
          docker run -d --name contacts-sql -p 127.0.0.1:1433:1433 -e ACCEPT_EULA=Y \
            -e "MSSQL_SA_PASSWORD=$db_password" mcr.microsoft.com/mssql/server:2022-latest
          trap 'docker rm -f contacts-sql >/dev/null' EXIT
          sql=(docker exec -e "SQLCMDPASSWORD=$db_password" contacts-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b)
          for attempt in {1..60}; do
            if "${sql[@]}" -Q 'SELECT 1' >/dev/null 2>&1; then break; fi
            sleep 2
          done
          "${sql[@]}" -Q 'CREATE DATABASE contact_book'
          export SPRING_DATASOURCE_URL='jdbc:sqlserver://localhost:1433;databaseName=contact_book;encrypt=true;trustServerCertificate=true'
          export SPRING_DATASOURCE_USERNAME=sa SPRING_DATASOURCE_PASSWORD="$db_password"
          export SPRING_SQL_INIT_MODE=always SPRING_SQL_INIT_SCHEMA_LOCATIONS=classpath:schema-sqlserver.sql
          export SPRING_JPA_HIBERNATE_DDL_AUTO=validate
          mvn -B -Dtest=ApplicationFlowTest,ContactRepositoryTest test
      - name: Start a temporary SonarQube server
        if: github.event_name != 'pull_request' && vars.SONAR_HOST_URL == ''
        shell: bash
        run: |
          set -euo pipefail
          url=http://127.0.0.1:9000
          docker run -d --name contact-sonar -p 127.0.0.1:9000:9000 sonarqube:community
          for attempt in {1..100}; do
            if curl -fsS "$url/api/system/status" 2>/dev/null | jq -e '.status == "UP"' >/dev/null; then break; fi
            sleep 3
          done
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          curl -fsS -u admin:admin -X POST "$url/api/users/change_password" \
            -d login=admin -d previousPassword=admin --data-urlencode "password=$password"
          token=$(curl -fsS -u "admin:$password" -X POST "$url/api/user_tokens/generate" \
            -d name=contact-book-ci | jq -er '.token')
          echo "::add-mask::$token"
          echo "LOCAL_SONAR_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Analyze Java and JavaScript
        if: github.event_name != 'pull_request'
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'http://127.0.0.1:9000' }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN || env.LOCAL_SONAR_TOKEN }}
      - name: Record the completed analysis
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'http://127.0.0.1:9000' }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN || env.LOCAL_SONAR_TOKEN }}
        run: |
          set -euo pipefail
          task=$(sed -n 's/^ceTaskId=//p' .scannerwork/report-task.txt)
          for attempt in {1..80}; do
            result=$(curl -fsS -u "$SONAR_TOKEN:" "$SONAR_HOST_URL/api/ce/task?id=$task")
            status=$(jq -r '.task.status' <<< "$result")
            case "$status" in
              SUCCESS) break ;;
              FAILED|CANCELED) echo "SonarQube analysis $status"; exit 1 ;;
            esac
            sleep 3
          done
          test "$status" = SUCCESS
          curl -fsS -u "$SONAR_TOKEN:" --get "$SONAR_HOST_URL/api/measures/component" \
            -d component=cohort-10-java-19696-ali -d metricKeys=bugs,vulnerabilities,code_smells,coverage,ncloc \
            | jq -r '.component.measures[] | "- " + .metric + " = " + .value' >> "$GITHUB_STEP_SUMMARY"
